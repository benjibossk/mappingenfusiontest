<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Reforger Mapper">
  <title>Reforger Mapper</title>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4f7a"/>
      <stop offset="1" stop-color="#0f2f4d"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4f6b34"/>
      <stop offset="1" stop-color="#8a9a52"/>
    </linearGradient>
    <clipPath id="badge"><rect x="8" y="8" width="144" height="144" rx="28"/></clipPath>
  </defs>

  <rect width="640" height="160" rx="24" fill="#14202b"/>
  <!-- badge: island seen from above -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#sea)"/>
  <g clip-path="url(#badge)">
    <!-- island and contour lines -->
    <path d="M38 98 C30 74 46 50 70 44 C92 38 116 46 124 66 C132 86 122 112 98 120 C76 127 46 120 38 98 Z" fill="url(#land)"/>
    <path d="M52 94 C48 76 60 60 78 57 C96 54 112 62 114 78 C116 94 104 108 86 110 C70 112 56 108 52 94 Z" fill="none" stroke="#c9c58a" stroke-opacity=".55" stroke-width="2"/>
    <path d="M66 88 C64 77 72 69 83 68 C94 67 102 73 102 82 C102 92 94 98 84 99 C75 100 68 96 66 88 Z" fill="none" stroke="#e8e2b0" stroke-opacity=".7" stroke-width="2"/>
    <!-- river -->
    <path d="M86 84 C96 96 104 104 122 116" fill="none" stroke="#5aa7e6" stroke-width="3.5" stroke-linecap="round"/>
    <!-- road -->
    <path d="M30 120 C50 108 56 92 72 84 C88 76 100 60 132 52" fill="none" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 120 C50 108 56 92 72 84 C88 76 100 60 132 52" fill="none" stroke="#2b2b2b" stroke-width="1.2" stroke-dasharray="5 5" stroke-linecap="round"/>
    <!-- grid -->
    <g stroke="#ffffff" stroke-opacity=".08" stroke-width="1">
      <path d="M8 44H152M8 80H152M8 116H152M44 8V152M80 8V152M116 8V152"/>
    </g>
  </g>
  <!-- map pin -->
  <g transform="translate(92 30)">
    <path d="M0 34 C-14 18 -16 12 -16 6 A16 16 0 0 1 16 6 C16 12 14 18 0 34 Z" fill="#ff6b3d" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="0" cy="5" r="6" fill="#1a1a1a"/>
  </g>

  <!-- wordmark -->
  <text x="178" y="82" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="1" fill="#e9eef2">REFORGER</text>
  <text x="180" y="124" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="10" fill="#ff6b3d">MAPPER</text>
  <rect x="180" y="134" width="300" height="3" rx="1.5" fill="#ff6b3d" opacity=".5"/>
</svg>
